name: Dice Tray Android build

on:
  push:
    paths:
      - "dice-tray/**"
      - ".github/workflows/dice-tray-android.yml"
  pull_request:
    paths:
      - "dice-tray/**"
      - ".github/workflows/dice-tray-android.yml"
  workflow_dispatch:

concurrency:
  group: dice-tray-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dice-tray
    shell: bash

env:
  NDK_VERSION: 27.2.12479018

jobs:
  android:
    name: Blackbox Protocol Dice Tray (Android APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); add what the build needs.
      - name: Install Android SDK packages
        working-directory: .
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dice-tray/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dice-tray/src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # The Android Studio project is generated from tauri.conf.json on each build,
      # then given the app icon (app-icon.png).
      - name: Generate Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android init --ci
          npx tauri icon app-icon.png

      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --ci

      # Signs with the ANDROID_KEYSTORE_BASE64 secret when it is set (so updates
      # install over the previous version). Without it, a one-off key is made for
      # this build: the APK installs, but replacing it needs an uninstall first.
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          test -n "$UNSIGNED" || { echo "No unsigned release APK found"; exit 1; }
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a one-off key."
            KEYSTORE_PASSWORD=android
            KEY_ALIAS=dicetray
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Blackbox Protocol Dice Tray"
          fi
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --out out/BlackboxProtocolDiceTray.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify out/BlackboxProtocolDiceTray.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackboxProtocolDiceTray-android-apk
          path: dice-tray/out/BlackboxProtocolDiceTray.apk
          if-no-files-found: error
