name: Dice Tray Windows build

on:
  push:
    paths:
      - "dice-tray/**"
      - ".github/workflows/dice-tray-windows.yml"
  pull_request:
    paths:
      - "dice-tray/**"
      - ".github/workflows/dice-tray-windows.yml"
  workflow_dispatch:

concurrency:
  group: dice-tray-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dice-tray

jobs:
  windows:
    name: Blackbox Protocol Dice Tray (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dice-tray/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dice-tray/src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Svelte and TypeScript check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build exe and installers
        run: npx tauri build
        shell: bash

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: BlackboxProtocolDiceTray-windows-x64-portable
          path: dice-tray/src-tauri/target/release/blackbox-protocol-dice-tray.exe
          if-no-files-found: error

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: BlackboxProtocolDiceTray-windows-x64-installers
          path: |
            dice-tray/src-tauri/target/release/bundle/nsis/*.exe
            dice-tray/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
