name: Foundation reference tests

on:
  push:
    paths:
      - "tests/**"
      - ".github/workflows/foundation-reference-tests.yml"
  pull_request:
    paths:
      - "tests/**"
      - ".github/workflows/foundation-reference-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-tests:
    name: Node 22 reference suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute committed reference fixtures
        run: node --test tests/*.test.mjs
