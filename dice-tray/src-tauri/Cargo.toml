[package]
name = "blackbox-protocol-dice-tray"
version = "0.1.0"
description = "Blackbox Protocol Dice Tray"
edition = "2021"

[lib]
name = "blackbox_dice_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
